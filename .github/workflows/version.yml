name: Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a republicar (por defecto la de .github/version.txt)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: version-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publicar version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: version-package
      cancel-in-progress: false
    env:
      BRANCH: ${{ github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}
      BEFORE_COMMIT: ${{ github.event.before }}
      AFTER_COMMIT: ${{ github.event.after }}
      INPUT_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar identidad de git
        run: |
          git config user.name "pintuclic-version-bot"
          git config user.email "pintuclic-version-bot@users.noreply.github.com"

      - name: Crear tag y publicar Release
        run: node .github/scripts/versioning.mjs release
