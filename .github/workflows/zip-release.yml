name: Zip Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar versión
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            VERSION="0.1.0"
          else
            BASE=${LATEST%.*}
            PATCH=${LATEST##*.}
            VERSION="$BASE.$((PATCH + 1))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSIÓN: $VERSION (última: ${LATEST:-ninguna})"

      - name: Generar notas de cambios
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "# Cambios de ${{ steps.version.outputs.version }}"
            echo ""
            git log --oneline "$RANGE" | sed 's/^/- /'
          } > RELEASE_NOTES.md
          echo "::group::Notas de cambios"
          cat RELEASE_NOTES.md
          echo "::endgroup::"

      - name: Comprimir repositorio
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive --format=zip --output="/tmp/pintuclic-$VERSION.zip" HEAD

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: main
          name: pintuclic-${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: /tmp/pintuclic-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
