name: Zip Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml
  release:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar versión y generar notas del changelog
        id: version
        run: node .github/scripts/check-release.mjs --notes
      - name: Proteger etiqueta existente
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" || { echo "La versión ya pertenece a otro commit"; exit 1; }
          fi
      - name: Comprimir exclusivamente archivos versionados
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git archive --format=zip --output="/tmp/pintuclic-$VERSION.zip" "$GITHUB_SHA"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: pintuclic-${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: /tmp/pintuclic-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
