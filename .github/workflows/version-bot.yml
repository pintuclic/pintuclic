name: Version Bot

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-bot-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Actualizar version
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular y registrar version
        run: |
          set -euo pipefail
          MSG=$(git log -1 --pretty=%B)
          if ! printf '%s' "$MSG" | grep -qE '\[v?[0-9]+\.[0-9]+\.[0-9]+\]'; then
            echo "El ultimo commit no trae la marca [X.Y.Z]; no se toca la version."
            exit 0
          fi
          BRACKET=$(printf '%s' "$MSG" | grep -oE '\[v?[0-9]+\.[0-9]+\.[0-9]+\]' | head -1 | tr -d '[]v')
          CURRENT=$(grep -m1 -E '^## \[v?[0-9]+\.[0-9]+\.[0-9]+\]' docs/CHANGELOG.md | sed -E 's/^## \[v?([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          if [ -z "$CURRENT" ]; then
            echo "No se encontro la version actual en docs/CHANGELOG.md" >&2
            exit 1
          fi
          IFS=. read -r MA MI PA <<< "$CURRENT"
          IFS=. read -r B1 B2 B3 <<< "$BRACKET"
          if [ "$B1" -gt 0 ]; then
            NEW="$((MA + 1)).0.0"
            NIVEL="MAJOR"
          elif [ "$B2" -gt 0 ]; then
            NEW="$MA.$((MI + 1)).0"
            NIVEL="MINOR"
          else
            NEW="$MA.$MI.$((PA + 1))"
            NIVEL="PATCH"
          fi
          if grep -qE "^## \[v?$NEW\]" docs/CHANGELOG.md; then
            echo "La version v$NEW ya esta registrada; no se duplica."
            exit 0
          fi
          echo "Nivel: $NIVEL | Version: v$CURRENT -> v$NEW"
          ENTRY=$(mktemp)
          {
            echo "## [v$NEW] - $(date +%F)"
            echo
            echo "- **Cambio:** $(printf '%s' "$MSG" | grep -m1 -E '\[v?[0-9]+\.[0-9]+\.[0-9]+\]' | head -1)"
            echo
          } > "$ENTRY"
          awk -v entry="$ENTRY" 'BEGIN{done=0} /^## \[v/{if(!done){while((getline line < entry)>0) print line; close(entry); done=1}} {print}' docs/CHANGELOG.md > /tmp/changelog.new
          mv /tmp/changelog.new docs/CHANGELOG.md
          git config user.name "pintuclic-version-bot"
          git config user.email "pintuclic-version-bot@users.noreply.github.com"
          git add docs/CHANGELOG.md
          git commit -m "chore(release): [skip ci] registrar v$NEW en CHANGELOG"
          git push origin "HEAD:${{ github.ref_name }}"
