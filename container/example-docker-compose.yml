services:
  db:
    image: postgres:15-alpine
    container_name: pintuclic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pintuclic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pintuclic}
      POSTGRES_DB: ${POSTGRES_DB:-pintuclic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pintuclic} -d ${POSTGRES_DB:-pintuclic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: container/backend/Dockerfile
    container_name: pintuclic-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-pintuclic}:${POSTGRES_PASSWORD:-pintuclic}@db:5432/${POSTGRES_DB:-pintuclic}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ..
      dockerfile: container/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: pintuclic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
